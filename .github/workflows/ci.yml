name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported baseline; 3.14 exercises the current stable
        # runtime without making builds depend on a moving "latest" alias.
        python-version: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck libfuse2 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller
      - name: Compile Python sources
        run: python -m compileall -q src workshop_downloader
      - name: Import smoke test
        run: python -c "import sys; sys.path.insert(0, 'src'); from PyQt6.QtWidgets import QApplication; app = QApplication([]); import core.morrenus_api, managers.game_manager, ui.main_window"
      - name: Validate shell scripts
        # steamless-aio.sh contains an embedded base64 Python payload; ShellCheck
        # correctly cannot parse that payload as shell source. Keep syntax
        # validation for it, while linting the maintainable shell scripts.
        run: shellcheck --severity=error install.sh uninstall.sh packaging/build_appimage.sh && bash -n install.sh uninstall.sh steamless-aio.sh packaging/build_appimage.sh
      - name: Validate bundled resources
        run: test -f src/res/version && test -f src/res/logo/icon.png && test -f src/deps/DepotDownloader.dll && test -f src/deps/steamless.py

  appimage:
    name: Build AppImage
    needs: checks
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      ASSELLA_APPIMAGE_NAME: ASSella.AppImage.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2 fuse squashfs-tools desktop-file-utils libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller
      - name: Download appimagetool
        run: |
          curl -fL --retry 3 -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Build development AppImage
        run: bash packaging/build_appimage.sh
      - name: Smoke test development AppImage bundle
        run: |
          test -s ASSella.AppImage.dev
          set +e
          timeout 20 ./ASSella.AppImage.dev --check-updates
          status=$?
          set -e
          [[ "$status" -eq 0 || "$status" -eq 124 ]]
      - name: Upload development AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ASSella-AppImage-dev-${{ github.sha }}
          path: ASSella.AppImage.dev
          if-no-files-found: error
          retention-days: 14
